<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- Static (pre-JS) theming so browser chrome, website-to-APK/TWA wrappers,
         and the OS status/navigation bar are themed correctly from first paint.
         Keep in sync with the manifest theme_color/background_color in vite.config.ts
         and with the dynamic theme-color updates in StudentDashboard.tsx. -->
    <meta name="theme-color" content="#030717" />
    <meta name="background-color" content="#030717" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NSTA" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>NSTA</title>
    <meta name="description" content="NSTA - Comprehensive learning platform with syllabus, notes, audio studio, MCQs, and student progress tracking." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="NSTA" />
    <meta property="og:description" content="NSTA - Comprehensive learning platform with syllabus, notes, audio studio, MCQs, and student progress tracking." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NSTA" />
    <meta name="twitter:description" content="NSTA - Comprehensive learning platform with syllabus, notes, audio studio, MCQs, and student progress tracking." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body style="background:#030717;margin:0">
    <style>
      html, body, #root {
        min-height: 100%;
        background: radial-gradient(circle at 50% 18%, #1e1b4b 0%, #0c1033 40%, #030717 100%);
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 18%, #1e1b4b 0%, #0c1033 40%, #030717 100%);
      }
      #boot-splash img {
        width: min(78vw, 360px);
        height: auto;
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 0 36px rgba(56, 189, 248, 0.24);
      }
    </style>
    <div id="boot-splash" aria-label="NSTA loading">
      <img src="branding/nsta-logo.png" alt="NSTA" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
