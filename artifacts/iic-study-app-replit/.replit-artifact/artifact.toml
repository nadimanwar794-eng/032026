kind = "web"
previewPath = "/"
title = "IIC NSTA Study App"
description = "A learning platform for students with syllabus, notes, audio study tools, MCQ practice, and progress tracking."
version = "1.0.0"
id = "artifacts/iic-study-app-replit"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23975

[services.development]
run = "pnpm --filter @workspace/iic-study-app-replit run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/iic-study-app-replit", "run", "build" ]
serve = "static"
publicDir = "artifacts/iic-study-app-replit/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23975"
BASE_PATH = "/"
