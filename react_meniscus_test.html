<!DOCTYPE html>
<html>
<head>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
<style>
  body { margin: 0; background: #eee; font-family: sans-serif; }
  .nav { position: fixed; bottom: 0; width: 100%; height: 64px; background: transparent; display: flex; }
  .tab { flex: 1; text-align: center; line-height: 64px; z-index: 10; cursor: pointer; color: white; font-weight: bold; }
  .tab.active { transform: translateY(10px); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function MeniscusNavIndicator({ activeIndex, totalTabs }) {
  const dockPathRef = useRef(null);
  const beadRef = useRef(null);
  const containerRef = useRef(null);
  const animState = useRef({ currentX: 0, targetX: 0, velocity: 0, w: 360, h: 64 });

  useEffect(() => {
    let raf;
    const loop = () => {
      const spring = 0.16;
      const damping = 0.68;
      const state = animState.current;
      const force = (state.targetX - state.currentX) * spring;
      state.velocity = (state.velocity + force) * damping;
      state.currentX += state.velocity;

      if (dockPathRef.current && containerRef.current) {
        const W = state.w;
        const H = state.h;
        const R = 20;
        const cx = state.currentX;
        const sw = 36;
        const depth = 28;
        const left = Math.max(0, cx - sw);
        const right = Math.min(W, cx + sw);

        // Simple path without border radius on corners for testing
        const path = `M 0,0 L ${left},0 C ${left + 12},0 ${cx - 20},${depth} ${cx},${depth} C ${cx + 20},${depth} ${right - 12},0 ${right},0 L ${W},0 L ${W},${H} L 0,${H} Z`;
        dockPathRef.current.setAttribute('d', path);
        dockPathRef.current.parentElement.setAttribute('viewBox', `0 0 ${W} ${H}`);
      }
      if (beadRef.current) {
         beadRef.current.style.transform = `translateX(${state.currentX - 24}px)`;
      }
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, []);

  useEffect(() => {
     const updateTarget = () => {
        if (containerRef.current) {
           const rect = containerRef.current.getBoundingClientRect();
           animState.current.w = rect.width;
           animState.current.h = rect.height;
           const tabWidth = rect.width / totalTabs;
           animState.current.targetX = (activeIndex * tabWidth) + (tabWidth / 2);

           // Initialize currentX to targetX if it's 0 (first load)
           if (animState.current.currentX === 0) {
              animState.current.currentX = animState.current.targetX;
           }
        }
     };
     updateTarget();
     window.addEventListener('resize', updateTarget);
     return () => window.removeEventListener('resize', updateTarget);
  }, [activeIndex, totalTabs]);

  return (
    <div ref={containerRef} style={{position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'visible'}}>
       <svg style={{position: 'absolute', inset: 0, width: '100%', height: '100%'}} preserveAspectRatio="none">
          <path ref={dockPathRef} fill="#1e1b4b" stroke="rgba(255,255,255,0.1)" strokeWidth="1" />
       </svg>
       <div ref={beadRef} style={{position: 'absolute', top: '-10px', left: '0', width: '48px', height: '48px', borderRadius: '50%', background: '#c8f53c', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 0 15px rgba(200, 245, 60, 0.6)', zIndex: 5}}>
       </div>
    </div>
  );
}

function App() {
  const [active, setActive] = useState(0);
  const tabs = ['Home', 'Search', 'Profile', 'Settings'];
  return (
    <div className="nav">
      <MeniscusNavIndicator activeIndex={active} totalTabs={tabs.length} />
      {tabs.map((t, i) => (
        <div key={t} className={`tab ${active === i ? 'active' : ''}`} onClick={() => setActive(i)}>
          {t}
        </div>
      ))}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
