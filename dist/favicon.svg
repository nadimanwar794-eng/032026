<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="25%" stop-color="#ffd043"/>
      <stop offset="50%" stop-color="#e5a91b"/>
      <stop offset="75%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#b47e09"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Rounded Square / Badge -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#goldGrad1)" stroke-width="4" opacity="0.85"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>

  <!-- Ambient Core Glow -->
  <circle cx="256" cy="230" r="190" fill="url(#coreGlow)"/>

  <!-- Heraldic Shield Behind -->
  <path d="M256 70 C330 70 380 90 380 150 C380 270 290 350 256 375 C222 350 132 270 132 150 C132 90 182 70 256 70 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad1)" stroke-width="3.5" filter="url(#softShadow)"/>

  <path d="M256 80 C322 80 368 98 368 152 C368 258 288 332 256 355 C224 332 144 258 144 152 C144 98 190 80 256 80 Z" 
        fill="none" stroke="url(#cyanGlow)" stroke-width="1.5" opacity="0.4"/>

  <!-- Laurel Wreath Left Side -->
  <g fill="url(#goldGrad1)" opacity="0.9" filter="url(#softShadow)">
    <ellipse cx="116" cy="150" rx="11" ry="5.5" transform="rotate(-45 116 150)"/>
    <ellipse cx="104" cy="180" rx="12" ry="6" transform="rotate(-30 104 180)"/>
    <ellipse cx="98" cy="214" rx="13" ry="6" transform="rotate(-15 98 214)"/>
    <ellipse cx="98" cy="250" rx="13" ry="6" transform="rotate(0 98 250)"/>
    <ellipse cx="104" cy="286" rx="13" ry="6" transform="rotate(20 104 286)"/>
    <ellipse cx="118" cy="320" rx="13" ry="6" transform="rotate(40 118 320)"/>
    <ellipse cx="140" cy="350" rx="13" ry="6" transform="rotate(60 140 350)"/>
    <ellipse cx="170" cy="375" rx="12" ry="5.5" transform="rotate(75 170 375)"/>

    <ellipse cx="126" cy="168" rx="9" ry="4.5" transform="rotate(-50 126 168)"/>
    <ellipse cx="116" cy="200" rx="10" ry="5" transform="rotate(-30 116 200)"/>
    <ellipse cx="112" cy="234" rx="10" ry="5" transform="rotate(-10 112 234)"/>
    <ellipse cx="114" cy="268" rx="10" ry="5" transform="rotate(15 114 268)"/>
    <ellipse cx="126" cy="302" rx="10" ry="5" transform="rotate(35 126 302)"/>
    <ellipse cx="148" cy="332" rx="10" ry="5" transform="rotate(55 148 332)"/>
  </g>

  <!-- Laurel Wreath Right Side -->
  <g fill="url(#goldGrad1)" opacity="0.9" filter="url(#softShadow)">
    <ellipse cx="396" cy="150" rx="11" ry="5.5" transform="rotate(45 396 150)"/>
    <ellipse cx="408" cy="180" rx="12" ry="6" transform="rotate(30 408 180)"/>
    <ellipse cx="414" cy="214" rx="13" ry="6" transform="rotate(15 414 214)"/>
    <ellipse cx="414" cy="250" rx="13" ry="6" transform="rotate(0 414 250)"/>
    <ellipse cx="408" cy="286" rx="13" ry="6" transform="rotate(-20 408 286)"/>
    <ellipse cx="394" cy="320" rx="13" ry="6" transform="rotate(-40 394 320)"/>
    <ellipse cx="372" cy="350" rx="13" ry="6" transform="rotate(-60 372 350)"/>
    <ellipse cx="342" cy="375" rx="12" ry="5.5" transform="rotate(-75 342 375)"/>

    <ellipse cx="386" cy="168" rx="9" ry="4.5" transform="rotate(50 386 168)"/>
    <ellipse cx="396" cy="200" rx="10" ry="5" transform="rotate(30 396 200)"/>
    <ellipse cx="400" cy="234" rx="10" ry="5" transform="rotate(10 400 234)"/>
    <ellipse cx="398" cy="268" rx="10" ry="5" transform="rotate(-15 398 268)"/>
    <ellipse cx="386" cy="302" rx="10" ry="5" transform="rotate(-35 386 302)"/>
    <ellipse cx="364" cy="332" rx="10" ry="5" transform="rotate(-55 364 332)"/>
  </g>

  <!-- Crown / Star at Top of Shield -->
  <g transform="translate(256, 110)" filter="url(#softShadow)">
    <!-- Center 5-pointed star -->
    <path d="M0 -22 L6 -7 L22 -7 L10 3 L14 18 L0 9 L-14 18 L-10 3 L-22 -7 L-6 -7 Z" fill="url(#goldGrad1)"/>
    <circle cx="-42" cy="0" r="5" fill="url(#goldGrad1)"/>
    <circle cx="42" cy="0" r="5" fill="url(#goldGrad1)"/>
    <circle cx="-68" cy="8" r="3.5" fill="url(#goldGrad1)" opacity="0.8"/>
    <circle cx="68" cy="8" r="3.5" fill="url(#goldGrad1)" opacity="0.8"/>
  </g>

  <!-- Open Knowledge Book Icon -->
  <g transform="translate(256, 172)" filter="url(#softShadow)">
    <!-- Left page -->
    <path d="M-8 8 C-35 -2 -75 -2 -90 12 L-90 48 C-75 34 -35 34 -8 44 Z" 
          fill="#0c4a6e" stroke="url(#cyanGlow)" stroke-width="2.5"/>
    <!-- Left page lines -->
    <path d="M-20 18 C-42 12 -70 14 -80 22" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <path d="M-20 28 C-42 22 -70 24 -80 32" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <!-- Right page -->
    <path d="M8 8 C35 -2 75 -2 90 12 L90 48 C75 34 35 34 8 44 Z" 
          fill="#0c4a6e" stroke="url(#cyanGlow)" stroke-width="2.5"/>
    <!-- Right page lines -->
    <path d="M20 18 C42 12 70 14 80 22" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <path d="M20 28 C42 22 70 24 80 32" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <!-- Book spine / center bookmark -->
    <path d="M0 6 L0 52 L-4 46 L0 44 L4 46 Z" fill="url(#goldGrad1)"/>
    <polygon points="0,0 -8,8 8,8" fill="url(#goldGrad1)"/>
  </g>

  <!-- Large Bold 3D Monogram: NSTA -->
  <g filter="url(#softShadow)">
    <!-- Drop Shadow Offset -->
    <text x="257" y="287" text-anchor="middle" 
          font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" 
          font-weight="900" font-size="68" letter-spacing="6" fill="#000000" opacity="0.75">
      NSTA
    </text>
    <!-- Main Golden Embossed Text -->
    <text x="256" y="285" text-anchor="middle" 
          font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" 
          font-weight="900" font-size="68" letter-spacing="6" fill="url(#goldGrad1)" stroke="#78350f" stroke-width="1.5">
      NSTA
    </text>
  </g>

  <!-- Subtitle Tagline Inside Shield -->
  <text x="256" y="318" text-anchor="middle" 
        font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" 
        font-weight="700" font-size="14" letter-spacing="4" fill="#38bdf8" opacity="0.95">
    NATIONAL STUDY APP
  </text>

  <!-- Golden Bottom Banner Ribbon -->
  <g transform="translate(256, 420)" filter="url(#softShadow)">
    <!-- Ribbon back folds -->
    <polygon points="-190,0 -160,-18 -160,18" fill="#78350f"/>
    <polygon points="190,0 160,-18 160,18" fill="#78350f"/>
    <polygon points="-160,18 -140,18 -160,28" fill="#451a03"/>
    <polygon points="160,18 140,18 160,28" fill="#451a03"/>

    <!-- Main Banner Body -->
    <path d="M-160 -18 L160 -18 Q0 -10 160 18 L-160 18 Q0 10 -160 -18 Z" 
          fill="url(#goldGrad2)" stroke="#fef08a" stroke-width="1.5"/>

    <!-- Banner Inscribed Text -->
    <text x="0" y="6" text-anchor="middle" 
          font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" 
          font-weight="800" font-size="15" letter-spacing="4" fill="#1e1b4b">
      LEARN  •  GROW  •  LEAD
    </text>
  </g>
</svg>