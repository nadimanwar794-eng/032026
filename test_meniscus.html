<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
/* Base styles */
body { margin: 0; background: #000; }
.nav-container { position: fixed; bottom: 0; width: 100%; height: 72px; }
.dock-svg { width: 100%; height: 100%; }
.bead { position: absolute; width: 48px; height: 48px; background: red; border-radius: 50%; top: -10px; }
</style>
</head>
<body>
  <div class="nav-container">
     <svg class="dock-svg" preserveAspectRatio="none">
        <path id="path" fill="#222" />
     </svg>
     <div class="bead" id="bead"></div>
  </div>
  <script>
    const path = document.getElementById('path');
    const bead = document.getElementById('bead');
    let w = window.innerWidth;
    let currentX = w / 2;
    let targetX = w / 2;
    let velocity = 0;

    function generatePath(cx, W, H, R) {
      const sw = 36;
      const depth = 28;
      const left = Math.max(R, cx - sw);
      const right = Math.min(W - R, cx + sw);
      return `M ${R},0
      L ${left},0 C ${left + 12},0 ${cx - 20},${depth} ${cx},${depth}
      C ${cx + 20},${depth} ${right - 12},0 ${right},0
      L ${W - R},0 A ${R},${R} 0 0 1 ${W},${R}
      L ${W},${H - R} A ${R},${R} 0 0 1 ${W - R},${H}
      L ${R},${H} A ${R},${R} 0 0 1 0,${H - R}
      L 0,${R} A ${R},${R} 0 0 1 ${R},0 Z`;
    }

    function loop() {
      const spring = 0.16;
      const damping = 0.68;
      const force = (targetX - currentX) * spring;
      velocity = (velocity + force) * damping;
      currentX += velocity;

      path.setAttribute('d', generatePath(currentX, w, 72, 20));
      bead.style.transform = `translateX(${currentX - 24}px)`;
      requestAnimationFrame(loop);
    }
    loop();

    window.addEventListener('click', (e) => {
      targetX = e.clientX;
    });
    window.addEventListener('resize', () => { w = window.innerWidth; });
  </script>
</body>
</html>
